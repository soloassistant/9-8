# 离线检查：把 selfcheck（全量验收断言）与各回归入口接到 push / PR 上。
#
# 为什么存在：这些检查原本只能在本地手动跑 —— 项目是 Taro 小程序 + H5、没有独立的测试阶段，
# 一旦有人改坏（最容易出事的是「去重规则被后人调松」和「类目 i18n 漏键」），没有任何自动拦截。
# 这与 lingxi-class 仓库把 1796 项断言接进 CI 是同一个动机。
#
# 只跑**不依赖外网**的检查：
#   · typecheck      tsc --noEmit（全仓 0 错误）
#   · selfcheck      全量验收断言（2026-10-13 为 27 项）。CI 里 spawn 可用，所以 tsc 那一项会真跑而不是 SKIP
#   · verify:dedupe  96 对人工标注基准集上的 P/R/F1 回归（纯离线、确定性）
#   · verify:intel   用仓库内的冻结夹具做条数/类目数/最大类目占比阈值回归（纯离线）
#   · verify:extlink 外链门禁 isSafeExternalUrl 的判定矩阵回归（纯离线、就地转译源码）
#   · verify:trust   信任过滤「接线」回归：三条产出链路是否都真的调到了过滤器（纯离线）
#   · verify:batch1  A 返回键 / B 订阅分叉 / C tab 新鲜窗口的结构性回归（纯离线、读源码断言）
#   · verify:cloudllm 云端 LLM 超时与熔断行为回归（纯离线，用 globalThis 打桩替掉 create）
#   · verify:ledger-aggregate 记账聚合口径回归（今日口径 / 类目 Top3 / 预算标记 / 未知分类占位）
#   · verify:ledger-export    记账导出回归（CSV 转义与公式注入前置 / 文件名 / 空数据短路 / 双端分支）
#   · verify:login-bind       登录后「绑定手机号」门禁回归（邮箱登录不得被反复强弹，绑完必须落标记）
#   · verify:sxm              省心买决策纯逻辑回归（认不出必须 null、给不出深链必须 ok:false、URL 落官方域）
#   · verify:sync             同步冲突回归（classifyPull 判定矩阵 / 未裁决键不静默覆盖 / 键位文案齐全）
#   · verify:auth             登录态接线回归（H5 真会话不被假身份替换 / 账号标识脱敏 / 源码无编码损坏）
#   · verify:paid             付费权益回归（支付回调与主动查单两条对账路径都必须真发放，且幂等）
#   · verify:prelaunch        上市前整改回归（外链协议白名单 / 云函数 OPENID 空值拒绝 / 署名档位 / i18n 键）
#   · verify:share            分享 AI 标识回归（AI 前缀受档位门控 / 免费档文案不含 AI / 剪贴板跟随标识）
#   · verify:honesty          假数据/假能力诚实性回归（示例条目级标注 / H5 不 mock 不扣额度）
#   · verify:crash           崩溃上报回归（H5 原生 error 监听 / 打码 / 只写 RPC）
#   · verify:pref-select     H5 客户端偏好选位回归（算法与云端 selectForUser 逐条对齐）
#   · verify:phone-intl      登录页国际区号回归（钉住「区号不得含 +1」并逐条验证 SDK 不改写）
#   · verify:cloudfunctions  云函数离线门禁（24 个云函数在无凭据下也守结构与权限边界）
#   · verify:deploy          云函数部署预检分支回归（AppID/密钥/环境 ID 错在哪，不许到上传时才发现）
#   · verify:cloudflow       云函数业务逻辑行为回归（忠实 wx-server-sdk 内存实现 + 跨函数链路 / 越权 / 幂等）
#   · verify:briefing        晨报首屏结构与状态机回归（记账卡位置 / 四态渲染 / 待办勾选回填）
#   · verify:mutation         元验证：把源码改坏后上面的断言必须变红（守「断言有判别力」）
#
# **故意不放进这里**（与 lingxi-class 的取舍一致：联网的东西会让 CI 在 fork/PR 上不可靠）：
#   · npm run vet:sources     要联网实测 16 个 RSS 源；外网抖动会让 CI 变红且结论不可信
#   · npm run verify:boards   要联网，且需要本机 DailyHotApi 起在 6688
#   · verify-sources.js       要联网抓 3 个 RSS，还要本机 8137 的 /api/hotspot
#   · verify-summary-quality  默认读 dist/api/hotspot.json；换成仓库内冻结夹具则夹具本身是旧语料（会红）
#   · refresh-hotspot-data    已有独立 workflow（refresh-data.yml）
# 这两个联网检查请在改动源清单/板块时**手动**跑，而不是塞进 CI。

name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 refresh-data.yml 保持一致
          node-version: 20
          cache: yarn

      - name: 安装依赖
        # 用 yarn：仓库里只有 yarn.lock（没有 package-lock.json）。
        # frozen-lockfile 可用性已核对过：45 个依赖全部被锁文件覆盖。
        run: yarn install --frozen-lockfile

      - name: 类型检查
        run: npm run typecheck

      # 名字里**不写条数**：写死条数在这类断言集上是维护陷阱（加一项就要改名字，
      # 忘了改就变成一个会骗人的标签 —— 本项目已因「判据写死字面量」吃过一次假红）。
      - name: 自检（全量验收断言）
        run: |
          set +e
          node .tools/selfcheck.js
          code=$?
          # 退出码约定：0 = 全部 PASS，1 = 有 FAIL，2 = 无 FAIL 但有 SKIP
          # （SKIP 是「受限环境下跑不了」，不等于失败；但在 CI 里正常应当为 0）
          if [ "$code" -eq 2 ]; then
            echo "::warning::自检存在 SKIP 项（非失败），请人工确认跳过原因"
            exit 0
          fi
          exit "$code"

      - name: 去重规则回归（96 对基准集）
        # 这条同时是「去重规则不许被悄悄调松」的守门人：
        # 词面放宽会立刻打穿精确率（已有 112 档阈值扫描为证），基准集会当场变红。
        run: npm run verify:dedupe

      - name: 资讯阈值回归（离线夹具）
        # 用仓库内的冻结夹具，而不是 .tools/cache/hotspot.json —— 后者是 gitignore 的本机缓存，CI 里不存在。
        run: node .tools/analyze-intel.js .tools/fixtures/hotspot-sample.json

      - name: 外链门禁回归（isSafeExternalUrl）
        # 这条是「外链白名单不许被调松」的守门人。该函数是 H5 端 window.open 的唯一屏障，
        # url 来自 RSS 抓回的外部内容；2026-10-12 已被改坏过两次（先是误拒站内路径打死省心买入口，
        # 后是前缀判断被 `"/\t/evil.com"` 绕过 —— URL 解析器会静默删除 \t \n \r）。
        # 判定矩阵固化后，谁再调松谁当场变红。
        run: npm run verify:extlink

      - name: 信任过滤接线回归
        # 这条守的是「过滤器被**接上**」而不是「过滤器能过滤」：过滤逻辑本身对了，
        # 但三条产出链路（云函数 / fetch-data / 构建期）只要有一条没调用它，
        # 内容就照样带着投毒条目上线 —— 2026-10-12 就出过这个缺口，且当时没有任何自动拦截。
        # 纯离线（用 Module._load 给 wx-server-sdk 打桩），可安全进 CI。
        run: npm run verify:trust

      - name: 交互结构回归（返回键 / 订阅分叉 / tab 新鲜窗口）
        # 守的是三处「结构一改就静默失效」的接线：返回键的落点、订阅态两套分支的必经点、
        # 以及 tab 切回时新鲜窗口守卫是否真的包住了刷新。这些点在 2026-10 的 P0 里
        # 「切 tab 不刷新」就是守卫被挪到定时器外面造成的，而当时 41 个 harness 全绿。
        run: npm run verify:batch1

      - name: 云端 LLM 超时与熔断回归
        # 守的是「云端卡死时调用方不能无限挂起」：60s 超时须返回 null，且熔断窗口内
        # 直接短路、不再打云端。用 globalThis 打桩替掉 SDK 的 create，不产生真实网络请求，
        # 因此不会受外网抖动影响。
        run: npm run verify:cloudllm

      - name: 记账聚合口径回归
        # 守的是「今日」这个词的边界：只算今天（不含昨日/前日）、类目 Top3 截断、
        # 预算未设置时的 hasBudget 取值、未知类目必须落到占位而不是渲染空白。
        # 2026-10 的 P0「预算输入被静默清空」正属于这条链路口径被改坏。
        run: npm run verify:ledger-aggregate

      - name: 记账导出回归
        # 守的是导出文件的两类硬伤：CSV 字段转义（RFC4180）与公式注入前置（= + - @ 开头必须转义），
        # 以及空数据短路、文件名口径、H5 下载与小程序剪贴板两条分支不被合并成一条。
        run: npm run verify:ledger-export

      - name: 登录绑定门禁回归
        # 守的是「邮箱登录不得被绑定手机号反复强弹」：旧判据在 H5 会话里恒 undefined，
        # 且绑定成功从不落标记，形成每次登录都强弹的死循环（2026-10-21 实证）。
        # 用 esbuild 就地编译纯函数 bindPhoneGate.ts，并跑变异版确认断言抓得住回归。
        run: npm run verify:login-bind

      - name: 省心买决策纯逻辑回归
        # 守的是「拿不到就必须如实失败」：resolveCityName 认不出返回 null、给不出深链返回 ok:false，
        # 不允许静默降级成一个看起来能点的假链接；产出的 URL 必须落在 12306 / 淘宝官方域。
        # 就地 bundle src 源码（不走 dist，避免 terser 重命名导致断言失焦）。
        run: npm run verify:sxm

      - name: 同步冲突回归
        # 守的是「跨设备冲突不再静默覆盖」：classifyPull 判定矩阵、未裁决键不参与推送、
        # 冲突列表合并与裁决入口，以及 21 个同步键在中英文案里都有可读标签（防 storageKey 裸奔）。
        run: npm run verify:sync

      - name: 偏好选位回归
        # 守的是「用户偏好真的改变**集合**，而不是只在已截断的 10 条里改顺序」：
        # 缓存池按 HOTSPOT_POOL_SIZE 扩宽、出口 selectForUser 按偏好 tag 保底选位。
        # 同时钉住热点页出口仍是「每源最多 1 条」的广度口径（扩池后直接 slice 会把
        # 十家媒体的观感塌成三家）。用冻结的真实抓取池夹具，不联网。
        run: npm run verify:pref

      - name: 登录态接线回归
        # 守的是「H5 会话不得被假身份替代」：登录必须走真会话而不是本地兜底，
        # 且账号标识一律脱敏（数字 user.id 也不能整串当昵称渲染）；顺带守住源文件
        # 没有被 GBK/U+FFFD 污染 —— 这类损坏会让字符串断言静默失效。
        run: npm run verify:auth

      - name: 付费权益回归
        # 守的是「付了钱订阅必须真的生效」：pay-callback 回调与 queryOrder 主动查单
        # 两条对账路径都要发放权益，且重复回调幂等（不重复对账、expiredAt 不叠加）。
        # 全程内存桩替掉 wx-server-sdk / cloudPay，不连真云、不发网络请求。
        run: npm run verify:paid

      - name: 上市前整改回归
        # 守的是三个曾经出过事的对外契约：外链白名单（站内相对路径必须放行，
        # 但协议相对 //evil.com 与反斜杠绕过仍须拒绝）、云函数 OPENID 空值必须拒绝、
        # 免费档不得署「AI 整理」。与 verify:extlink 结论互为交叉校验，两边不得相反。
        run: npm run verify:prelaunch

      - name: 分享 AI 标识回归
        # 守的是「AI 前缀只在订阅档且未降级时出现」：免费/降级档的情报来自公开 RSS 本地分组、
        # 全程无 LLM，署 AI 名即虚假陈述；中性文案本身也不得含 AI 字样。
        # 断言读源码里的门控表达式，防「key 还在但门控被拆掉」的假合规。
        run: npm run verify:share

      - name: 假数据 / 假能力诚实性回归
        # 守的是「不许骗用户」这条产品底线：学习社区的内置示例动态必须**条目级**挂「示例」徽章
        # （老 storage 数据按 seed- 前缀补标，不能和真实动态混排），页级降级要如实提示；
        # H5 没有语音转写能力时不得用预置文案冒充识别结果，更不能因此消耗真实语音额度。
        # 这两类问题读代码觉得没问题、用户却会被骗，所以断言只认源码事实并钉住守卫顺序。
        run: npm run verify:honesty

      - name: 待办状态确定性写入回归
        # 守的是「勾选待办必须真的落库」：H5 的 writePlan 会吞异常（静默失败），
        # weapp 曾走 apiChat 让 LLM 解析「完成了『xxx』」决定改哪一条 → 假完成 / 标错条目。
        # 现在本地写后回读校验 + 云函数按 _id+openid 收敛，页面必须先写后改 UI。
        run: npm run verify:todo

      - name: 崩溃上报回归
        # 守的是「H5 崩了有人知道」：改前上报只挂在 Taro.cloud.callFunction 上，
        # 而 H5 没有 Taro.cloud → 整段跳过，公开入口崩了完全无人知晓。
        # 同时守住隐私边界（邮箱/手机号/token 必须打码）、崩溃路径不得二次崩、
        # 以及写入必须走只写 RPC log_client_error（直接 insert 表会 42501）。
        run: npm run verify:crash

      - name: H5 客户端偏好选位回归
        # 守的是「H5 静态链路上的用户偏好真的改变情报集合」：云端 selectForUser 未部署，
        # H5 只能在自己这一侧重排；这里钉住算法与云端逐条对齐（偏好保底 → 广度保底 →
        # 补足 → 偏好置前排序），并钉住 getBriefing 走的是选位而不是 slice(0,3)
        # （slice 等于偏好失效，用户选了「科学」也只会看到按时间排的前 3 条）。
        # 用 60 条真实抓取的冻结夹具真执行 src/utils/prefSelect.ts，不联网。
        run: npm run verify:pref-select

      - name: 登录页国际区号回归
        # 守的是「登录页选了中国香港，短信真的发到香港号码」。
        # 关键约束：云 SDK 的 normalizePhone 只归一 +86，其余区号原样透传；而它的判据是
        # `/^1\d{10}$/`，北美 E.164 恰好是「1 + 10 位」→ 会被**静默改写**成 +86 号码
        # （实测 `+14155550123` 发出去变成 `+86 14155550123`，是真的能送达的号段）。
        # 所以区号表里刻意不含 +1，本步骤把这个禁令钉死：静态断言 + 用 vm 真加载 SDK、
        # 截获 sendOtp 请求体，把整张区号表逐条喂给真 SDK 验证「未被改写」。
        run: npm run verify:phone-intl

      - name: 云函数离线门禁
        # 24 个云函数目前**一个都部署不了**（缺 WX_APPID / WX_PRIVATE_KEY_PATH / WX_CLOUD_ENV，
        # 根因是小程序主体未注册）。没人部署，就没有任何环节会去加载这些文件——
        # 一个语法错误、丢掉 exports.main、退化的 openid 守卫，可以静静躺几个月，
        # 直到第一次真部署那天才炸，而且炸在线上。
        # 这里用 vm + 桩 SDK 把它们拉进日常射程：结构完整 / 能被加载 / 缺 OPENID 必须拒绝 /
        # 不用 _openid 查 / 不留硬编码 AppID。不联网、不需要微信凭据。
        run: npm run verify:cloudfunctions

      - name: 云函数部署预检分支回归
        # deploy-cloud.mjs 是唯一会把代码推上微信云的路，但它没法在无凭据环境端到端跑。
        # 结果就是「缺配置 → exit 2」这一条验过，其余分支（AppID 写成 gh_、密钥不是 RSA、
        # 环境 ID 写成环境名）从没被执行过一次。这些分支失败的代价在上传途中：
        # 前几个函数成功、后面全挂，留下半残环境。
        # 这里用临时配置文件 + 真生成的 RSA/EC 密钥把七个分支逐个跑一遍，全程 --check 不上传。
        run: npm run verify:deploy

      - name: 云函数业务逻辑行为回归
        # 上一步只证明「能被加载、守卫在」，不执行任何真实业务逻辑 —— 桩是「任何属性都返回自身」的万能桩。
        # 这一步给 wx-server-sdk 一个进程内**忠实实现**（真内存集合、真 where/update/inc/serverDate 语义），
        # 把云函数当普通函数调用，验跨函数链路（login→updateSettings→todoStatus）、越权、幂等、配额、
        # 注销级联、订单归属、额度账本。
        # 首次接入就抓到 8 个真实缺陷，其中两个 P0：chat 首轮 usage 文档无 _id（免费用户每月第一条
        # 消息必失败且额度永不累加）、注销清单漏 errors（崩溃日志留着用户 openid，F18 合规硬伤）。
        # 零网络：启动时主动清空 LLM_*/WEATHER_*/PAY_*/*_TEMPLATE_ID，外部能力全部走「必须明确失败」断言。
        run: npm run verify:cloudflow

      - name: 晨报首屏结构与状态机回归
        # 守 2026-10-24 审计发现并修掉的 6 个「手感」缺陷：记账卡被粘进右上角图标按钮行内
        # （卡片在 flex 行里撑开、压垮问候语列）、hasContent 不看情报（有情报却显示
        # 「今天还没有安排」）、首帧先闪空态、加载失败伪装成真空态、勾完的待办重进复位、
        # 「共 N 项已守护」用 navigateTo 跳 tabBar 页点了没反应。
        # 全是结构性判据（JSX 挂在哪个父节点、四态渲染顺序、catch 导向哪个 UI 态），读源码断言。
        run: npm run verify:briefing

      - name: 按钮 disabled 静态门禁
        # Taro H5 把 <Button disabled={false}> 渲染成 disabled="false"，而 CSS 属性选择器
        # 只看属性在不在 → 内置的 taro-button-core[disabled]{color:rgba(255,255,255,.6)}
        # （特异性 0,1,1）压过组件类（0,1,0），把白底按钮变成白底白字、对比度 1.00、整个消失。
        # 2026-10-24 实测：「立即订阅」按钮 DOM 里文案在、屏幕上没有。
        # 根治只能让属性在条件为假时**不渲染**（utils/buttonDisabled.ts），所以这里守写法：
        # 任何 <Button> 带 disabled 就必须是 disabledAttr(...)。CSS 层无法区分真禁用/没禁用。
        run: npm run verify:buttons

      - name: 对比度静态门禁（109 条）
        # 2026-10-24 审计指出「verify:contrast 写好了却没接 CI」—— 这里补上。
        # 它与 verify:buttons 是**两层**：buttons 守「属性渲染方式」，这一步守「配色算出来能不能读」
        # （白字压浅橙、金色当正文、付费卡 75% 白、真禁用被 WeUI 染白）。
        # 纯静态读 scss/ts，不拉浏览器、不联网，CI 里可稳定跑。
        # ⚠️ 局限（据实写明）：只覆盖清单里的类名 —— 清单外的类它看不见。
        # 所以每发现一处新的「看得见但读不清」，必须同时加进 STRONG_POINTS/J_POINTS，
        # 否则下次还是漏（本次 subCard/consentAgree/postButton/extractButton 就是这么漏的）。
        run: npm run verify:contrast

      - name: 交互契约门禁（49 条）
        # 守用户实际反馈过的交互：热点点开原文、时间块不被压、客服可执行、密码登录入口、
        # 全网搜索失败≠空态、意见反馈不谎报成功、天气城市先校验后落库、突发横幅不冒充推送。
        # 其中 I 组是**运行时**断言（esbuild 编译 src/utils/burst.ts 后真调 pickBurst）。
        run: npm run verify:interaction

      - name: 工具逻辑门禁（29 条）
        # 与上面同一条教训：verify:util 写好了却没接 CI 就等于没写。
        # 守 utils/{schedule,permission,habit,readStreak,date} 的纯逻辑契约（时间块排序/权限降级/
        # 连续阅读/问候语四种事实分支），都是**行为断言**而不是「文件里出现过某符号」。
        run: npm run verify:util

      - name: 功能记账 + 续费管理门禁（62 条）
        # 2026-10-24 新增。这两块都属于「不报错但静默错到底」：记账口径错了（把降级 mock 也记上）
        # 用户看到的用量是假的；续费判定错了（今天到期判成已过期）用户会在还有效时看到「已过期」。
        # A/B 组是 esbuild 编译 src 源码后**真跑**纯函数；C 组框到具体分支证明 mock/失败分支不记账；
        # D 组把 scss 里的颜色真算一遍对比度（不是比对字符串）。
        run: npm run verify:usage

      - name: 法务条文 ↔ 实现数据流门禁（34 条）
        # 2026-10-24 新增。上一轮的取证方法有漏洞：用 grep 搜到 cloudfunctions/chat 里有 msgSecCheck
        # 就判合规，但 H5 走 cloud.llm 直连、**不经过**它；同一个错误在供应商上也犯过（条文写 DeepSeek，
        # H5 实际用平台目录下发的 hy4-preview）。
        # 所以这里的判据一律是「这条链路上这个调用有没有发生」：先从代码抽出事实（模型默认值 / 通道联合
        # 类型 / 域名调用点 / 函数体内两个调用的先后），再拿事实去要求文本；文本里每加一句绝对话
        # （唯一/仅/全部/一键）都要在白名单里给出证明，否则红。
        # ⚠️ 它**不能**替产品决定「该不该这么承诺」（境内地域、运营者主体仍需人定）。
        run: npm run verify:legal

      # 放在最后：这一步会**临时改写源码**再复原（写完做 sha256 逐字节校验，失配退出码 3），
      # 因此必须等其他只读步骤跑完，避免与它们在同一个工作区里互相踩。
      # 它守的不是产品行为，而是「上面这些断言本身有没有判别力」——把已知缺陷改回去，
      # 断言必须变红；变不红说明断言是假绿的。case 里只收录基线为绿的 harness。
      - name: 断言判别力元验证（变异测试）
        run: npm run verify:mutation

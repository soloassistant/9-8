<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-web-app-status-bar-style" content="white" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>私人晨报助理</title>
    <!--
      WorkBuddy 云服务 SDK（认证用）—— **自托管**，不再从 jsdelivr CDN 拉取。
      原因（2026-10-14 修复线上 "cloud sdk unavailable / 登录服务连不上"）：
        1) 此前从 cdn.jsdelivr.net 加载 IIFE 全局 WorkBuddyCloud；该 CDN 在中国大陆
           经常被墙/超时 → 用户浏览器里 window.WorkBuddyCloud 永不定义 →
           "云服务未加载"（auth.errSdkUnavailable）。
        2) 现把 SDK 钉死的那个构建（0.1.3-dev.c090db7.202610050023，sha384 已校对该字节）
           落地到 src/assets/wb-sdk.js，构建后随产物发到 ./assets/wb-sdk.js，同源加载，
           不再依赖任何外部 CDN。

      版本仍是 dev 线那个具体构建（与 2026-10-13 锁定的一致），等价于"冻结 @dev 的字节"；
      src/assets/wb-sdk.js 的 sha384 已与旧 CDN integrity 比对一致（fjris8pRF0OENf…），
      要升级必须显式换文件 + 同步改这里。
      同源本地文件无需 SRI/crossorigin：去掉 integrity，避免将来 1 字节差异就拒绝执行。

      ⚠️ 2026-10-30：这里从 `defer` 改成 `async`，**因为 defer 会把 SDK 串行卡在主包前面**。
      实测（线上真浏览器网络时间线，3 次）：发布网关对**单个请求**有 20–31 秒的首字节长尾
      （实测 20402ms / 23851ms / 30877ms），而同一批并行请求里其余的只要 0.4–3 秒。
      `defer` 脚本按**文档序**执行 ⇒ 本文件里 SDK 排在 webpack 注入的
      `js/657.*.js` / `js/app.*.js` 之前 ⇒ **SDK 那一枪卡住，整个应用就卡住**：
        · 线上实测第 3 次加载：app.js 早在 3.7 秒就下载完了，却因为 SDK 首字节卡了
          23.8 秒，应用到 27.6 秒才挂载；
        · 线上实测第 2 次加载：卡在 657.*.js 的 30.9 秒 ⇒ 30 秒内**根本没挂载**，
          用户一直看着「正在准备今天的晨报…」。
      改 `async` 后 SDK 与主包**并行下载、互不阻塞**，谁先到谁先执行。

      安全性：SDK 全局 `window.WorkBuddyCloud` **只在 `cloudAuth.getCloudClient()` 里读**，
      而它前置的 `waitForSdk()` 本来就是「轮询等全局出现（超时按不可用处理）」——
      说明代码本来就假设 SDK 可能晚到。2026-10-30 同步把 waitForSdk 的上限提到 8s
      （网关长尾实测到 31 秒），并加了「超时则重新注入一次 <script>」的补救
      （长尾是**按请求**随机的，重试换一个请求往往就快了）。
      ⇒ 唯一的行为变化：SDK 可能在 app.js 之后执行；凡是读它的代码都必须走
      waitForSdk()/getCloudClient()，不能直接摸 window.WorkBuddyCloud。
    -->
    <script async src="./assets/wb-sdk.js"></script>
    <script>
      <%= htmlWebpackPlugin.options.script %>
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

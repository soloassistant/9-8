<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-web-app-status-bar-style" content="white" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>私人晨报助理</title>
    <!--
      WorkBuddy 云服务 SDK（认证用）。
      为什么用 CDN 而不是 npm 依赖：仓库用 yarn.lock + CI 的 `yarn install --frozen-lockfile`，
      而本机没有 yarn；用 npm 装只会写 package-lock、不更新 yarn.lock，CI 会直接挂在 lockfile 校验上。
      按 SDK 文档的降级路径改用 CDN IIFE（全局 WorkBuddyCloud），且不往 package.json 加依赖。
      仅 H5/发布版需要：微信小程序侧不加载本脚本（微信身份直接登录）。

      ★ 版本必须仍是 dev 线的构建（`latest` = 0.1.3 是旧构建，功能不全）—— 所以**不要**改成 `0.1.3`。
      这里把它**钉死在 `dev` 当时解析到的那个具体版本** `0.1.3-dev.c090db7.202610050023`
      （2026-10-13 实测 `dist-tags.dev` 正是它），等价于"冻结当前 @dev 的字节"：
      - `@dev/lib/index.global.js` 与 `@0.1.3-dev.c090db7.202610050023/lib/index.global.js`
        两次下载 sha256 完全相同（`0e1ab581…`，67666 B）→ 固定版本**不改变**当前加载的内容。
      - 以后再发新版（哪怕再推 dev）也**不会**改变线上行为；要升级必须显式改这里 + 同步换 integrity。
      为什么这么改（2026-10-12 视觉走查 §四缺陷3 的唯一未闭环项，2026-10-13 闭环）：
      未固定版本 + 无 SRI 时，CDN 发新版/被投毒都会直接改变登录行为，且无任何校验。
      2026-10-12 本轮没做是因为**本机连不上 cdn.jsdelivr.net**（curl http=000、WebFetch 失败），
      无法验证；2026-10-13 重测该域已可达（http=200），遂落地并做了"屏蔽 CDN / 不屏蔽 CDN"两种浏览器实测。

      `integrity` = 上述文件字节的 sha384（jsdelivr 回 `access-control-allow-origin: *`，
      故 `crossorigin="anonymous"` 可用）。注意 SRI 命中失败时浏览器**拒绝执行**该脚本 →
      落到 `auth.errSdkUnavailable` 的友好兜底页（已实测，不是白屏）。改 URL 必须同步重算 integrity。

      `defer` 的理由：app bundle 本身就是 `defer`，defer 脚本按**文档序**执行 → SDK 仍在 app 之前定义
      全局 `WorkBuddyCloud`，顺序不变（本页内联脚本只是 rem 根字号缩放，不依赖该全局，已在产物中确认）。
      好处是 CDN 慢/不可达时不再**阻塞首屏渲染**，用户先看到壳，再看到 `auth.errSdkUnavailable` 的友好兜底。
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@0.1.3-dev.c090db7.202610050023/lib/index.global.js" integrity="sha384-fjris8pRF0OENf5gUBh3VN3hCPgW92IW8Uunpc12O8bnah0T8rCp6TF7JGdFIyr0" crossorigin="anonymous"></script>
    <script>
      <%= htmlWebpackPlugin.options.script %>
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-web-app-status-bar-style" content="white" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>私人晨报助理</title>
    <!--
      WorkBuddy 云服务 SDK（认证用）—— **自托管**，不再从 jsdelivr CDN 拉取。
      原因（2026-10-14 修复线上 "cloud sdk unavailable / 登录服务连不上"）：
        1) 此前从 cdn.jsdelivr.net 加载 IIFE 全局 WorkBuddyCloud；该 CDN 在中国大陆
           经常被墙/超时 → 用户浏览器里 window.WorkBuddyCloud 永不定义 →
           "云服务未加载"（auth.errSdkUnavailable）。
        2) 现把 SDK 钉死的那个构建（0.1.3-dev.c090db7.202610050023，sha384 已校对该字节）
           落地到 src/assets/wb-sdk.js，构建后随产物发到 ./assets/wb-sdk.js，同源加载，
           不再依赖任何外部 CDN。

      版本仍是 dev 线那个具体构建（与 2026-10-13 锁定的一致），等价于"冻结 @dev 的字节"；
      src/assets/wb-sdk.js 的 sha384 已与旧 CDN integrity 比对一致（fjris8pRF0OENf…），
      要升级必须显式换文件 + 同步改这里。
      `defer` 保持：app bundle 本身也是 `defer`，按文档序 SDK 仍在 app 之前定义全局
      WorkBuddyCloud，顺序不变（内联 rem 脚本不依赖该全局，已在产物中确认）。
      同源本地文件无需 SRI/crossorigin：去掉 integrity，避免将来 1 字节差异就拒绝执行。
    -->
    <script defer src="./assets/wb-sdk.js"></script>
    <script>
      <%= htmlWebpackPlugin.options.script %>
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
